  <line x1="60" y1="0" x2="65" y2="160" stroke="#f0b86a" stroke-width="2" opacity="0.25" />
  <line x1="95" y1="0" x2="90" y2="160" stroke="#965e1b" stroke-width="2.5" opacity="0.4" />
  <line x1="135" y1="0" x2="140" y2="160" stroke="#f0b86a" stroke-width="1.5" opacity="0.3" />
