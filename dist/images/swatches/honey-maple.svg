      <stop offset="0%" stop-color="#f0b86a" />
      <stop offset="35%" stop-color="#d69748" />
      <stop offset="70%" stop-color="#bd7f32" />
      <stop offset="100%" stop-color="#965e1b" />
    </linearGradient>
    <filter id="woodGrain-HoneyMaple" x="0%" y="0%" width="100%" height="100%">
