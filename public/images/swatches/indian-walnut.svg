<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="grad-IndianWalnut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#693822" />
      <stop offset="35%" stop-color="#4e2817" />
      <stop offset="70%" stop-color="#391a0c" />
      <stop offset="100%" stop-color="#240f06" />
    </linearGradient>
    <filter id="woodGrain-IndianWalnut" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.4" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.25 0" />
      <feComposite in="SourceGraphic" in2="noise" operator="arithmetic" k1="0" k2="1" k3="0.3" k4="0" />
    </filter>
  </defs>
  <rect width="160" height="160" fill="url(#grad-IndianWalnut)" />
  <rect width="160" height="160" fill="#4e2817" opacity="0.85" filter="url(#woodGrain-IndianWalnut)" />
  <!-- Fine vertical wood streaks -->
  <line x1="25" y1="0" x2="30" y2="160" stroke="#240f06" stroke-width="1.5" opacity="0.35" />
  <line x1="60" y1="0" x2="65" y2="160" stroke="#693822" stroke-width="2" opacity="0.25" />
  <line x1="95" y1="0" x2="90" y2="160" stroke="#240f06" stroke-width="2.5" opacity="0.4" />
  <line x1="135" y1="0" x2="140" y2="160" stroke="#693822" stroke-width="1.5" opacity="0.3" />
</svg>